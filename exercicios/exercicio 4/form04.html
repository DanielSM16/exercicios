<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário de Telefone</h1>

    <form action="cadastro.php" method="get" autocomplete="on">

        <fieldset>
            <P>
                <label for="Inome">Nome</label>
                <input type="text" name="nome" id="Inome" min-length="5" max-length="20" required>
            </P>
            <p>
                <label for="iemail">Email</label>
                <input type="email" name="email" id="iemail" required>
            </p>
            <p>
                <label for="itel">Telefone</label>
                <input type="tel" name="tel" id="itel" autocomplete="tel"pattern="[0-9]{4,5}-[0-9]{4,5}" required placeholder="9999-9999">
            </p>
        </fieldset>
       <!--  estudar mais sobre expresoes regulares para validar telefone e email, e tambem sobre o atributo pattern do input -->
        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>



    </form>
</body>
</html>
