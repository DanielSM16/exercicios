<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>

    <Form method="get" autocomplete="">

        <P>
            <label for="iano">Ano</label>
            <input type="number" name="ano1" id="iano1" min="1900" max="2026" required oninput="caIdade()">
        </P>

        <p>
            <label for="idade">Sua idade é</label>
            <output id="idade">0</output>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

        <script>
            function caIdade() {
                let atual = new Date().getFullYear();
                idade.innerHTML = Number(atual) - Number(iano1.value);
            }
        </script>

    </Form>
    
</body>
</html>
