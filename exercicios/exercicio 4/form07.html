<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>

    <h1>Exemplos</h1>

    <form action="cadastro.php" method="post" autocomplete="on">

        <p>
            <label for="iestado">Estado</label>
            <select name="estado" id="iestado">

                <optgroup label="Sudeste">
                    <option value="MG">Minas Gerais</option>
                    <option value="SP">Sao Paulo</option>
                    <option value="RJ" selected>Rio de Janeiro</option>
                </optgroup>

                <optgroup label="Nordeste">
                    <option value="MA">Maranhão</option>
                    <option value="PE">Pernambuco</option>
                    <option value="RN">Rio Grande do Norte</option>
                </optgroup>
            </select>
        </p>

        <p>
            <label for="ipro">Provisao</label>
            <input type="text" name="provisao" id="iprovisao" list="iprovisao">

            <datalist id="iprovisao">
                <option>Administrador</option>
                <option value="DEV">Desenvolvedor</option>
                <option value="DBA">Banco de Dados</option>
            </datalist>
        </p>

        <p>

            <label for="imens">Mensagem</label> <br>
            <textarea name="mensagem" id="imensagem" cols="30" rows="10"></textarea>

        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
    
</body>
</html>
