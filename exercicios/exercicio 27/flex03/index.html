<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        div.container {
            background-color: #ac1212;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
        }

        div.item {
            background-color:aqua;
            border: 1px solid black;
            text-align: center;
            flex: auto;

        }

    </style>
    <title>Flexible box </title>
</head>
<body>

    <div class="container">
        <div class="item">Exemplo de bloco 1</div>
        <div class="item">Exemplo de bloco 2</div>
        <div class="item">Exemplo de bloco 3</div>
        <div class="item">Exemplo de bloco 4</div>
        <div class="item">Exemplo de bloco 5</div>
    </div>
    
</body>
</html>
