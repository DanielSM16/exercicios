<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        div.container {
            background-color: #ac1212;
            display: flex;
            flex-flow: row wrap;
        }

        div.item {
            background-color:aqua;
            border: 1px solid black;
            text-align: center;
            padding: 20px;
        }

    </style>
    <title>Flexible box </title>
</head>
<body>

    <div class="container">

        <div class="item" style="order: 0;">1</div>
        <div class="item" style="order: 3;">2</div>
        <div class="item" style="order: 2;">3</div>
        <div class="item" style="order: -4;">4</div>
        <div class="item" style="order: -1;" >5</div>
        <div class="item" style="order: 8;">6</div>
        <div class="item" style="order: 4;">7</div>
        <div class="item" style="order: 7;">8</div>
        <div class="item" style="order: 11;">9</div>
        <div class="item" style="order: 0;">10</div>

    </div>
    
</body>
</html>
