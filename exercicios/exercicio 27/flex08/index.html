<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        div.container {
            background-color: #ac1212;
            display: flex;
            flex-flow: row wrap;
            align-items: flex-start;
            height: 400px;
        }

        div.item {
            background-color:aqua;
            border: 1px solid black;
            text-align: center;
            padding: 20px;
        }

    </style>
    <title>Flexible box </title>
</head>
<body>

    <div class="container">

        <div class="item" style="align-self: center;">1</div>
        <div class="item" style="align-self: flex-end;" >2</div>
        <div class="item" style="align-self: center;">3</div>
        <div class="item" style="align-self: center;">4</div>
        <div class="item" style="align-self: auto;">5</div>
        <div class="item" style="align-self: self-end;">6</div>
        <div class="item" style="align-self: center;">7</div>
        <div class="item" style="align-self: center;">8</div>
        <div class="item" style="align-self: center;">9</div>
        <div class="item" style="align-self: center;   ">10</div>

    </div>
    
</body>
</html>
